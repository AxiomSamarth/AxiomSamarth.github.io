<!DOCTYPE html>
<html lang="en" data-baseurl="{{ site.baseurl }}">
<head>
  {% include head.html %}
</head>
<body class="site{% if page.body_class %} {{ page.body_class }}{% endif %}">
  <a class="skip-link" href="#main">Skip to main content</a>
  {% include header.html %}
  <main id="main" tabindex="-1">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
