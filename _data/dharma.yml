# Weekly rotating lines (client picks by calendar week). Edit or reorder anytime.
# Keys: source (transliteration or Sanskrit), gloss (English), ref (optional citation).

- source: "karmaṇy-evādhikāras te mā phaleṣu kadācana"
  gloss: "You have a right to action alone, never to its fruits."
  ref: "Bhagavad Gītā 2.47"

- source: "yogaḥ karmasu kauśalam"
  gloss: "Yoga is skill in action — steadiness in the middle of work."
  ref: "Bhagavad Gītā 2.50"

- source: "uddhared ātmanātmānaṃ nātmānam avasādayet"
  gloss: "Lift yourself by yourself; do not let yourself sink."
  ref: "Bhagavad Gītā 6.5"

- source: "adveṣṭā sarva-bhūtānāṃ maitraḥ karuna eva ca"
  gloss: "Without malice toward any being, friendly and compassionate."
  ref: "Bhagavad Gītā 12.13"

- source: "yuktāhāra-vihārasya yukta-ceṣṭasya karmasu"
  gloss: "Balanced in food and rest, balanced in effort and duty."
  ref: "Bhagavad Gītā 6.17"

- source: "śraddhāvān labhate jñānaṃ"
  gloss: "The faithful one attains wisdom."
  ref: "Bhagavad Gītā 4.39"

- source: "ātmaiva hy ātmano bandhur ātmaiva ripur ātmanaḥ"
  gloss: "The self is the self’s friend; the self is the self’s foe."
  ref: "Bhagavad Gītā 6.5–6"

- source: "yogasthaḥ kuru karmāṇi saṅgaṃ tyaktvā dhanañjaya"
  gloss: "Established in yoga, perform actions, letting go of clinging."
  ref: "Bhagavad Gītā 2.48"

- source: "vīta-rāga-bhaya-krodhā man-mayā mām upāśritāḥ"
  gloss: "Free from passion, fear, and anger, taking refuge in the highest."
  ref: "Bhagavad Gītā 4.10"

- source: "adhyātma-jñāna-nityatvaṃ tattva-jñānārtha-darśanam"
  gloss: "Constancy in the knowledge of the self; seeing the aim of truth-knowledge."
  ref: "Bhagavad Gītā 13.11"
